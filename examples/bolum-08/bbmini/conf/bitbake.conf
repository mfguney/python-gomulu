# OE-Core olmadan çalışan en küçük BitBake yapılandırması (Bölüm 8).
# Gerçek projelerde bu dosyayı OE-Core sağlar (meta/conf/bitbake.conf); burada yalnızca
# BitBake'in Python ile ilgili davranışlarını yalıtılmış biçimde denemek için kullanılır.

TMPDIR = "${TOPDIR}/tmp"
CACHE = "${TMPDIR}/cache"

PN = "${@bb.parse.vars_from_file(d.getVar('FILE', False), d)[0] or 'tarif'}"
PV = "${@bb.parse.vars_from_file(d.getVar('FILE', False), d)[1] or '1.0'}"
PF = "${PN}-${PV}"
WORKDIR = "${TMPDIR}/work/${PF}"
T = "${WORKDIR}/temp"
B = "${WORKDIR}/build"
STAMP = "${TMPDIR}/stamps/${PF}"

BBFILES = "${TOPDIR}/recipes/*.bb"

# OE-Core'daki meta/conf/layer.conf ile aynı yaklaşım: satır içi Python'da
# os, sys ve time modülleri içe aktarmadan kullanılabilir; lib/ornek paketi "ornek" adıyla yüklenir.
BB_GLOBAL_PYMODULES = "os sys time"
addpylib ${TOPDIR}/lib ornek

MACHINE = "agecidi"
DISTRO = "ornekos"
DISTRO_FEATURES = "systemd usrmerge ipv6"
OVERRIDES = "${MACHINE}:${DISTRO}"
